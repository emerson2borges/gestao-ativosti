<app-page-header title="Localizações e Setores" subtitle="Gestão de prédios, blocos, salas e setores da empresa">
  <button pButton label="Nova Localização" icon="pi pi-plus" class="p-button-indigo" (click)="abrirModalNovo()"></button>
</app-page-header>

<div class="card-panel">
  <p-table [value]="localizacoes" [paginator]="true" [rows]="10" styleClass="p-datatable-striped">
    <ng-template pTemplate="header">
      <tr>
        <th>ID</th>
        <th>Bloco / Setor</th>
        <th>Descrição</th>
        <th>Cidade / Filial</th>
        <th>UF</th>
        <th class="text-center">Ações</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-item>
      <tr>
        <td>#{{ item.id }}</td>
        <td><strong>{{ item.nomeBlocoSetor }}</strong></td>
        <td>{{ item.descricao || '-' }}</td>
        <td>{{ item.cidadeNome || 'N/A' }}</td>
        <td><code>{{ item.uf || '-' }}</code></td>
        <td class="text-center actions-cell">
          <button pButton icon="pi pi-pencil" class="p-button-rounded p-button-text p-button-sm" (click)="abrirModalEditar(item)"></button>
          <button pButton icon="pi pi-trash" class="p-button-rounded p-button-text p-button-danger p-button-sm" (click)="excluir(item)"></button>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog [(visible)]="displayModal" [header]="isEdit ? 'Editar Localização' : 'Nova Localização'" [modal]="true" [style]="{ width: '480px' }">
  <form [formGroup]="form" (ngSubmit)="salvar()">
    <div class="form-field">
      <label>Nome do Bloco / Setor *</label>
      <input pInputText formControlName="nomeBlocoSetor" placeholder="Ex: TI - Bloco A, Data Center Sala 04" />
    </div>
    <div class="form-field mt-3">
      <label>Cidade / Filial *</label>
      <p-select [options]="cidades" optionLabel="nome" optionValue="id" formControlName="cidadeId" placeholder="Selecione a cidade..." styleClass="w-full"></p-select>
    </div>
    <div class="form-field mt-3">
      <label>Descrição</label>
      <input pInputText formControlName="descricao" placeholder="Detalhes opcionais do setor" />
    </div>
    <div class="dialog-footer">
      <button pButton type="button" label="Cancelar" class="p-button-text" (click)="displayModal = false"></button>
      <button pButton type="submit" [label]="isEdit ? 'Salvar' : 'Cadastrar'" [disabled]="form.invalid"></button>
    </div>
  </form>
</p-dialog>
