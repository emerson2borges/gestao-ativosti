<app-page-header title="Estoque de Insumos TI" subtitle="Controle de periféricos, cabos, suprimentos e alerta de escassez">
  <button pButton label="Novo Insumo" icon="pi pi-plus" class="p-button-indigo" (click)="abrirModalNovo()"></button>
</app-page-header>

<div class="card-panel">
  <p-table [value]="estoque" [paginator]="true" [rows]="10" styleClass="p-datatable-striped">
    <ng-template pTemplate="header">
      <tr>
        <th>Item / Suprimento</th>
        <th>Categoria</th>
        <th>Qtd. Atual</th>
        <th>Qtd. Mínima</th>
        <th>Local de Armazenamento</th>
        <th>Status Estoque</th>
        <th class="text-center">Ações</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-item>
      <tr>
        <td><strong>{{ item.nomeItem }}</strong></td>
        <td>{{ item.categoria || 'Geral' }}</td>
        <td>
          <span [class.text-danger]="item.quantidadeAtual <= item.quantidadeMinima" class="qty-badge">
            {{ item.quantidadeAtual }} un
          </span>
        </td>
        <td>{{ item.quantidadeMinima }} un</td>
        <td>{{ item.localizacaoNome || 'Almoxarifado TI' }}</td>
        <td>
          <span *ngIf="item.quantidadeAtual <= item.quantidadeMinima" class="badge-alert">
            <i class="pi pi-exclamation-circle"></i> Repor Estoque
          </span>
          <span *ngIf="item.quantidadeAtual > item.quantidadeMinima" class="badge-ok">
            <i class="pi pi-check-circle"></i> Normal
          </span>
        </td>
        <td class="text-center actions-cell">
          <button pButton icon="pi pi-pencil" class="p-button-rounded p-button-text p-button-sm" (click)="abrirModalEditar(item)"></button>
          <button pButton icon="pi pi-trash" class="p-button-rounded p-button-text p-button-danger p-button-sm" (click)="excluir(item)"></button>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog [(visible)]="displayModal" [header]="isEdit ? 'Editar Insumo' : 'Cadastrar Novo Insumo'" [modal]="true" [style]="{ width: '500px' }">
  <form [formGroup]="form" (ngSubmit)="salvar()">
    <div class="form-grid">
      <div class="form-field full">
        <label>Nome do Item *</label>
        <input pInputText formControlName="nomeItem" placeholder="Ex: Cabo HDMI 2.0 3m, Teclado USB" />
      </div>
      <div class="form-field">
        <label>Categoria</label>
        <input pInputText formControlName="categoria" placeholder="Ex: Redes, Periféricos, Limpeza" />
      </div>
      <div class="form-field">
        <label>Localização</label>
        <p-select [options]="localizacoes" optionLabel="nomeBlocoSetor" optionValue="id" formControlName="localizacaoId" placeholder="Selecione..." styleClass="w-full"></p-select>
      </div>
      <div class="form-field">
        <label>Quantidade Atual *</label>
        <input type="number" pInputText formControlName="quantidadeAtual" />
      </div>
      <div class="form-field">
        <label>Quantidade Mínima *</label>
        <input type="number" pInputText formControlName="quantidadeMinima" />
      </div>
    </div>
    <div class="dialog-footer">
      <button pButton type="button" label="Cancelar" class="p-button-text" (click)="displayModal = false"></button>
      <button pButton type="submit" [label]="isEdit ? 'Salvar' : 'Cadastrar'" [disabled]="form.invalid"></button>
    </div>
  </form>
</p-dialog>
