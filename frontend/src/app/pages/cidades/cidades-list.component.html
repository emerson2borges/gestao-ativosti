<app-page-header title="Cidades e Filiais" subtitle="Cadastro das unidades regionais da empresa">
  <button pButton label="Nova Cidade" icon="pi pi-plus" class="p-button-indigo" (click)="abrirModalNovo()"></button>
</app-page-header>

<div class="card-panel">
  <p-table [value]="cidades" [paginator]="true" [rows]="10" styleClass="p-datatable-striped">
    <ng-template pTemplate="header">
      <tr>
        <th>ID</th>
        <th>Nome da Cidade</th>
        <th>Estado (UF)</th>
        <th class="text-center">Ações</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-item>
      <tr>
        <td>#{{ item.id }}</td>
        <td><strong>{{ item.nome }}</strong></td>
        <td><code>{{ item.uf }}</code></td>
        <td class="text-center actions-cell">
          <button pButton icon="pi pi-pencil" class="p-button-rounded p-button-text p-button-sm" (click)="abrirModalEditar(item)"></button>
          <button pButton icon="pi pi-trash" class="p-button-rounded p-button-text p-button-danger p-button-sm" (click)="excluir(item)"></button>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog [(visible)]="displayModal" [header]="isEdit ? 'Editar Cidade' : 'Nova Cidade'" [modal]="true" [style]="{ width: '400px' }">
  <form [formGroup]="form" (ngSubmit)="salvar()">
    <div class="form-field">
      <label>Nome da Cidade *</label>
      <input pInputText formControlName="nome" placeholder="Ex: João Pessoa, Recife, São Paulo" />
    </div>
    <div class="form-field mt-3">
      <label>UF *</label>
      <input pInputText formControlName="uf" placeholder="Ex: PB, PE, SP" maxlength="2" />
    </div>
    <div class="dialog-footer">
      <button pButton type="button" label="Cancelar" class="p-button-text" (click)="displayModal = false"></button>
      <button pButton type="submit" [label]="isEdit ? 'Salvar' : 'Cadastrar'" [disabled]="form.invalid"></button>
    </div>
  </form>
</p-dialog>
