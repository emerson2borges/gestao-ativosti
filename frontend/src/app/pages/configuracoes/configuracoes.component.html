<app-page-header title="Configurações & Gestão de Acesso" subtitle="Gerenciamento de usuários, perfis de acesso e permissões do sistema">
</app-page-header>

<div class="card-panel">
  <!-- Navegação por Abas -->
  <div class="tabs-header">
    <button class="tab-btn" [class.active]="activeTab === 'usuarios'" (click)="activeTab = 'usuarios'">
      <i class="pi pi-users"></i> Usuários
    </button>
    <button class="tab-btn" [class.active]="activeTab === 'perfis'" (click)="activeTab = 'perfis'">
      <i class="pi pi-shield"></i> Perfis & Permissões
    </button>
  </div>

  <!-- Aba 1: Usuários -->
  <div *ngIf="activeTab === 'usuarios'" class="tab-content">
    <div class="table-actions">
      <button pButton label="Novo Usuário" icon="pi pi-user-plus" class="p-button-indigo" (click)="abrirModalNovoUsuario()"></button>
    </div>

    <p-table [value]="usuarios" [paginator]="true" [rows]="10" styleClass="p-datatable-striped">
      <ng-template pTemplate="header">
        <tr>
          <th>Nome</th>
          <th>Matrícula</th>
          <th>E-mail</th>
          <th>Perfil</th>
          <th class="text-center">Ações</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-user>
        <tr>
          <td><strong>{{ user.nome }}</strong></td>
          <td><code>{{ user.matricula }}</code></td>
          <td>{{ user.email }}</td>
          <td>
            <span class="badge-perfil">{{ user.perfilNome || 'Sem perfil' }}</span>
          </td>
          <td class="text-center actions-cell">
            <button pButton icon="pi pi-pencil" class="p-button-rounded p-button-text p-button-sm" (click)="abrirModalEditarUsuario(user)"></button>
            <button pButton icon="pi pi-trash" class="p-button-rounded p-button-text p-button-danger p-button-sm" (click)="excluirUsuario(user)"></button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>

  <!-- Aba 2: Perfis -->
  <div *ngIf="activeTab === 'perfis'" class="tab-content">
    <div class="table-actions">
      <button pButton label="Novo Perfil" icon="pi pi-plus" class="p-button-indigo" (click)="abrirModalNovoPerfil()"></button>
    </div>

    <p-table [value]="perfis" [paginator]="true" [rows]="10" styleClass="p-datatable-striped">
      <ng-template pTemplate="header">
        <tr>
          <th>ID</th>
          <th>Nome do Perfil</th>
          <th>Permissões Associadas</th>
          <th class="text-center">Ações</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-perfil>
        <tr>
          <td>{{ perfil.id }}</td>
          <td><strong>{{ perfil.nome }}</strong></td>
          <td>
            <span *ngFor="let perm of perfil.permissoes" class="badge-perm">{{ perm.descricao || perm.chave }}</span>
            <span *ngIf="!perfil.permissoes || perfil.permissoes.length === 0" class="text-muted">Nenhuma</span>
          </td>
          <td class="text-center actions-cell">
            <button pButton icon="pi pi-pencil" class="p-button-rounded p-button-text p-button-sm" (click)="abrirModalEditarPerfil(perfil)"></button>
            <button pButton icon="pi pi-trash" class="p-button-rounded p-button-text p-button-danger p-button-sm" (click)="excluirPerfil(perfil)"></button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<!-- Modal Usuário -->
<p-dialog [(visible)]="displayModalUsuario" [header]="isEditUsuario ? 'Editar Usuário' : 'Novo Usuário'" [modal]="true" [style]="{ width: '500px' }">
  <form [formGroup]="formUsuario" (ngSubmit)="salvarUsuario()">
    <div class="form-grid">
      <div class="form-field full">
        <label>Nome Completo *</label>
        <input pInputText formControlName="nome" placeholder="Ex: João da Silva" />
      </div>
      <div class="form-field">
        <label>Matrícula *</label>
        <input pInputText formControlName="matricula" placeholder="Ex: M-2026-01" />
      </div>
      <div class="form-field">
        <label>E-mail *</label>
        <input pInputText formControlName="email" placeholder="joao@empresa.com" />
      </div>
      <div class="form-field full" *ngIf="!isEditUsuario">
        <label>Senha *</label>
        <input type="password" pInputText formControlName="senha" placeholder="******" />
      </div>
      <div class="form-field full">
        <label>Perfil de Acesso *</label>
        <p-select [options]="perfis" optionLabel="nome" optionValue="id" formControlName="perfilId" placeholder="Selecione..." styleClass="w-full"></p-select>
      </div>
    </div>
    <div class="dialog-footer">
      <button pButton type="button" label="Cancelar" class="p-button-text" (click)="displayModalUsuario = false"></button>
      <button pButton type="submit" [label]="isEditUsuario ? 'Salvar' : 'Cadastrar'" [disabled]="formUsuario.invalid"></button>
    </div>
  </form>
</p-dialog>

<!-- Modal Perfil -->
<p-dialog [(visible)]="displayModalPerfil" [header]="isEditPerfil ? 'Editar Perfil' : 'Novo Perfil'" [modal]="true" [style]="{ width: '450px' }">
  <form [formGroup]="formPerfil" (ngSubmit)="salvarPerfil()">
    <div class="form-grid">
      <div class="form-field full">
        <label>Nome do Perfil *</label>
        <input pInputText formControlName="nome" placeholder="Ex: Administrador, Técnico, Leitor" />
      </div>
    </div>
    <div class="dialog-footer">
      <button pButton type="button" label="Cancelar" class="p-button-text" (click)="displayModalPerfil = false"></button>
      <button pButton type="submit" [label]="isEditPerfil ? 'Salvar' : 'Cadastrar'" [disabled]="formPerfil.invalid"></button>
    </div>
  </form>
</p-dialog>
